name: API Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ecommerce-api

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ./ecommerce-api/package-lock.json

      - name: Clean Install dependencies
        run: npm ci

      - name: Run test suite with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: test_ci_secret_key
          PORT: 3000

    # You can add actions here to upload coverage reports to tools like Codecov or SonarCloud
